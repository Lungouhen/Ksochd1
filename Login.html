<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin Login</title>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-6 shadow">
      <a href="?page=home" class="text-blue-600">← Back</a>
      <h1 class="text-2xl font-bold mt-2">Admin Dashboard Login</h1>
      <p class="text-slate-600 text-sm mt-1">Authorized roles: Admin, President, General Secretary, Treasurer</p>

      <form id="loginForm" class="mt-6 space-y-4">
        <input class="w-full border rounded p-2" name="email" type="email" placeholder="Email" required>
        <input class="w-full border rounded p-2" name="password" type="password" placeholder="Password" required>
        <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700" type="submit">Login</button>
        <div id="message" class="text-sm"></div>
      </form>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('message');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        msg.textContent = 'Signing in...';
        msg.className = 'text-sm text-blue-600';

        const data = Object.fromEntries(new FormData(form).entries());
        google.script.run
          .withSuccessHandler((res) => {
            if (res.success) {
              localStorage.setItem('ksoToken', res.token);
              localStorage.setItem('ksoUser', JSON.stringify(res.user));
              window.location.href = '?page=dashboard';
            } else {
              msg.textContent = res.message || 'Login failed';
              msg.className = 'text-sm text-red-700';
            }
          })
          .withFailureHandler((err) => {
            msg.textContent = err.message || 'Login failed';
            msg.className = 'text-sm text-red-700';
          })
          .adminLogin(data.email, data.password);
      });
    </script>
  </body>
</html>
