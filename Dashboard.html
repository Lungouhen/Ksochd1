<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin Dashboard</title>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold">KSO Chandigarh Admin Dashboard</h1>
          <p id="userInfo" class="text-slate-600 text-sm"></p>
        </div>
        <div class="flex gap-2">
          <a href="?page=home" class="px-3 py-2 rounded border bg-white">Home</a>
          <button onclick="logout()" class="px-3 py-2 rounded bg-red-600 text-white">Logout</button>
        </div>
      </div>

      <div class="mt-6 bg-white rounded-xl border border-slate-200 p-4 flex flex-wrap gap-2 items-end">
        <div>
          <label class="text-xs text-slate-500">Type</label>
          <select id="memberType" class="border rounded p-2" onchange="loadMembers()">
            <option>Individual</option>
            <option>Family</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-500">Status</label>
          <select id="status" class="border rounded p-2" onchange="loadMembers()">
            <option>All</option>
            <option>Pending</option>
            <option>Approved</option>
            <option>Rejected</option>
          </select>
        </div>
        <div class="flex-1 min-w-56">
          <label class="text-xs text-slate-500">Search</label>
          <input id="search" class="w-full border rounded p-2" placeholder="Name / Enrollment / Email / Phone">
        </div>
        <button onclick="loadMembers()" class="px-3 py-2 rounded bg-blue-600 text-white">Apply</button>
        <button onclick="exportMembers()" class="px-3 py-2 rounded bg-emerald-600 text-white">Export Excel</button>
      </div>

      <div id="message" class="text-sm mt-3"></div>

      <div class="mt-4 bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-100 text-left">
            <tr>
              <th class="p-2">Enrollment No</th>
              <th class="p-2">Name</th>
              <th class="p-2">Email</th>
              <th class="p-2">Phone</th>
              <th class="p-2">Status</th>
              <th class="p-2">Payment</th>
              <th class="p-2">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <dialog id="detailModal" class="rounded-xl p-0 w-full max-w-xl">
      <div class="p-6">
        <h2 class="font-semibold text-lg mb-3">Member Details</h2>
        <div id="detailContent" class="space-y-1 text-sm"></div>
        <div class="mt-4 text-right"><button class="px-3 py-2 rounded border" onclick="document.getElementById('detailModal').close()">Close</button></div>
      </div>
    </dialog>

    <script>
      const token = localStorage.getItem('ksoToken');
      const user = JSON.parse(localStorage.getItem('ksoUser') || '{}');
      let currentRole = '';

      if (!token) window.location.href = '?page=login';
      document.getElementById('userInfo').textContent = `${user.fullName || ''} (${user.role || ''})`;

      function setMessage(text, type = 'info') {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = `text-sm mt-3 ${type === 'error' ? 'text-red-700' : type === 'success' ? 'text-green-700' : 'text-blue-700'}`;
      }

      function loadMembers() {
        const memberType = document.getElementById('memberType').value;
        const status = document.getElementById('status').value;
        const search = document.getElementById('search').value.trim();
        setMessage('Loading data...');

        google.script.run
          .withSuccessHandler((res) => {
            if (!res.success) return setMessage('Unable to load members', 'error');
            currentRole = res.role;
            renderRows(res.data || [], memberType);
            setMessage(`Loaded ${res.data.length} member(s).`, 'success');
          })
          .withFailureHandler((err) => setMessage(err.message || 'Unauthorized', 'error'))
          .getMembers(token, memberType, status, search);
      }

      function renderRows(data, memberType) {
        const rows = document.getElementById('rows');
        if (!data.length) {
          rows.innerHTML = '<tr><td class="p-3 text-slate-500" colspan="7">No members found.</td></tr>';
          return;
        }

        rows.innerHTML = data.map(member => {
          const canApprove = ['Admin', 'President', 'General Secretary'].includes(currentRole);
          const canPay = ['Admin', 'Treasurer'].includes(currentRole);
          return `<tr class="border-t">
            <td class="p-2">${member.EnrollmentNo || ''}</td>
            <td class="p-2">${member.Name || ''}</td>
            <td class="p-2">${member.Email || ''}</td>
            <td class="p-2">${member.Phone || ''}</td>
            <td class="p-2">${member.Status || ''}</td>
            <td class="p-2">${member.AmountPaid || '-'} ${member.ReceiptNo ? `(${member.ReceiptNo})` : ''}</td>
            <td class="p-2 space-x-1 whitespace-nowrap">
              ${canApprove ? `<button class="px-2 py-1 text-xs rounded bg-emerald-600 text-white" onclick="approve('${memberType}','${member.EnrollmentNo}','Approve')">Approve</button>
              <button class="px-2 py-1 text-xs rounded bg-amber-600 text-white" onclick="approve('${memberType}','${member.EnrollmentNo}','Reject')">Reject</button>` : ''}
              ${canPay ? `<button class="px-2 py-1 text-xs rounded bg-indigo-600 text-white" onclick="payment('${memberType}','${member.EnrollmentNo}')">Payment</button>` : ''}
              <button class="px-2 py-1 text-xs rounded border" onclick="detail('${memberType}','${member.EnrollmentNo}')">View</button>
            </td>
          </tr>`;
        }).join('');
      }

      function approve(memberType, enrollmentNo, action) {
        const notes = prompt(`Optional notes for ${action}:`, '');
        google.script.run
          .withSuccessHandler((res) => {
            setMessage(res.message || 'Updated', res.success ? 'success' : 'error');
            if (res.success) loadMembers();
          })
          .withFailureHandler((err) => setMessage(err.message || 'Action failed', 'error'))
          .approveMember(token, memberType, enrollmentNo, action, notes || '');
      }

      function payment(memberType, enrollmentNo) {
        const amount = prompt('Enter amount paid:');
        if (!amount) return;
        const paymentMode = prompt('Payment mode (Cash/UPI/Bank Transfer/etc):', 'Cash') || 'Cash';
        const notes = prompt('Optional payment notes:', '') || '';

        google.script.run
          .withSuccessHandler((res) => {
            setMessage(res.message || 'Payment recorded', res.success ? 'success' : 'error');
            if (res.success) loadMembers();
          })
          .withFailureHandler((err) => setMessage(err.message || 'Payment failed', 'error'))
          .recordPayment(token, memberType, enrollmentNo, Number(amount), paymentMode, notes);
      }

      function detail(memberType, enrollmentNo) {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res.success) return setMessage(res.message || 'Unable to fetch details', 'error');
            const m = res.member;
            document.getElementById('detailContent').innerHTML = `
              <div><strong>Name:</strong> ${m.Name || ''}</div>
              <div><strong>Enrollment:</strong> ${m.EnrollmentNo || ''}</div>
              <div><strong>Status:</strong> ${m.Status || ''}</div>
              <div><strong>Email:</strong> ${m.Email || ''}</div>
              <div><strong>Phone:</strong> ${m.Phone || ''}</div>
              <div><strong>Course:</strong> ${m.Course || ''}</div>
              <div><strong>Institution:</strong> ${m.Institution || ''}</div>
              ${m.PhotoURL ? `<div class="mt-3"><img src="${m.PhotoURL}" alt="Member photo" class="max-h-48 rounded border"></div>` : ''}
            `;
            document.getElementById('detailModal').showModal();
          })
          .withFailureHandler((err) => setMessage(err.message || 'Unable to fetch details', 'error'))
          .getMemberDetail(token, memberType, enrollmentNo);
      }

      function exportMembers() {
        const memberType = document.getElementById('memberType').value;
        google.script.run
          .withSuccessHandler((res) => {
            if (!res.success) return setMessage('Export failed', 'error');
            window.open(res.url, '_blank');
            setMessage('Export ready. Download will open in a new tab.', 'success');
          })
          .withFailureHandler((err) => setMessage(err.message || 'Export failed', 'error'))
          .exportMembers(token, memberType);
      }

      function logout() {
        google.script.run.logout(token);
        localStorage.removeItem('ksoToken');
        localStorage.removeItem('ksoUser');
        window.location.href = '?page=login';
      }

      loadMembers();
    </script>
  </body>
</html>
